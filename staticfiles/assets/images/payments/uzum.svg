<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 36" width="120" height="36">
  <defs>
    <style>
      .uzum-bg { fill: #7000ff; rx: 6px; }
      .uzum-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 20px; }
      .uzum-dot { fill: #ffffff; }
    </style>
  </defs>
  <rect width="120" height="36" rx="6" class="uzum-bg"/>
  <!-- Uzum grape mark -->
  <circle cx="15" cy="13" r="2.8" class="uzum-dot"/>
  <circle cx="22" cy="13" r="2.8" class="uzum-dot"/>
  <circle cx="18.5" cy="18" r="2.8" class="uzum-dot"/>
  <circle cx="18.5" cy="24" r="2.5" class="uzum-dot"/>
  <text x="32" y="25" class="uzum-text" letter-spacing="-0.3">uzum</text>
</svg>
