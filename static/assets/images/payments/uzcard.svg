<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 36" width="120" height="36">
  <defs>
    <style>
      .uzcard-text { fill: #005baa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 17px; }
      .uzcard-blue { fill: #005baa; }
      .uzcard-red { fill: #e30613; }
    </style>
  </defs>
  <!-- Uzcard dual overlapping cards mark -->
  <rect x="7" y="10" width="14" height="14" rx="2" class="uzcard-blue"/>
  <rect x="15" y="13" width="14" height="14" rx="2" class="uzcard-red" opacity="0.95"/>
  <text x="35" y="24" class="uzcard-text" letter-spacing="0.8">UZCARD</text>
</svg>
