<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title> Digital Market Place HTML Template</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'assets/images/logo/favicon.png' %}">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <!-- Fontawesome -->
    <link rel="stylesheet" href="{% static 'assets/css/fontawesome-all.min.css' %}">
    <!-- Slick -->
    <link rel="stylesheet" href="{% static 'assets/css/slick.css' %}">
    <!-- magnific popup -->
    <link rel="stylesheet" href="{% static 'assets/css/magnific-popup.css' %}">
    <!-- line awesome -->
    <link rel="stylesheet" href="{% static 'assets/css/line-awesome.min.css' %}">
    <!-- Main css -->
    <link rel="stylesheet" href="{% static 'assets/css/main.css' %}">

</head>
<body>

<!--==================== Preloader Start ====================-->
 <div class="loader-mask">
  <div class="loader">
      <div></div>
      <div></div>
  </div>
</div>
<!--==================== Preloader End ====================-->

<!--==================== Overlay Start ====================-->
<div class="overlay"></div>
<!--==================== Overlay End ====================-->

<!--==================== Sidebar Overlay End ====================-->
<div class="side-overlay"></div>
<!--==================== Sidebar Overlay End ====================-->

<!-- ==================== Scroll to Top End Here ==================== -->
<div class="progress-wrap">
  <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
      <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
  </svg>
</div>
<!-- ==================== Scroll to Top End Here ==================== -->

<!-- ==================== Mobile Menu Start Here ==================== -->
<div class="mobile-menu d-lg-none d-block">
    <button type="button" class="close-button"> <i class="las la-times"></i> </button>
    <div class="mobile-menu__inner">
        <a href="{% url 'index' %}" class="mobile-menu__logo">
            <img src="{% static 'assets/images/logo/logo.png' %}" alt="Logo">
        </a>
        <div class="mobile-menu__menu">

<ul class="nav-menu flx-align nav-menu--mobile">
    <li class="nav-menu__item"><a href="{% url 'index' %}" class="nav-menu__link">Bosh sahifa</a></li>
    <li class="nav-menu__item"><a href="{% url 'all_products' %}" class="nav-menu__link">Mahsulotlar</a></li>
    <li class="nav-menu__item"><a href="{% url 'cart' %}" class="nav-menu__link">Savat</a></li>
    <li class="nav-menu__item"><a href="{% url 'wishlist' %}" class="nav-menu__link">Saralanganlar</a></li>
    <li class="nav-menu__item"><a href="{% url 'd_login' %}" class="nav-menu__link">Panel</a></li>
</ul>
            <div class="header-right__inner d-lg-none my-3 gap-1 d-flex flx-align">

    <a href="{% url 'register' %}" class="btn btn-main pill">
        <span class="icon-left icon">
            <img src="{% static 'assets/images/icons/user.svg' %}" alt="">
        </span>Akkaunt yaratish
    </a>
    <div class="language-select flx-align select-has-icon">
        <img src="{% static 'assets/images/icons/globe.svg' %}" alt="" class="globe-icon">
        <select class="select py-0 ps-2 border-0 fw-500">
            <option value="1">Eng</option>
            <option value="2">Bn</option>
            <option value="3">Eur</option>
            <option value="4">Urd</option>
        </select>
    </div>
            </div>
        </div>
    </div>
</div>
<!-- ==================== Mobile Menu End Here ==================== -->

<!-- ================================== Account Page Start =========================== -->
<section class="account d-flex">
    <div class="account__left d-md-flex d-none flx-align section-bg position-relative z-index-1 overflow-hidden">
        <img src="{% static 'assets/images/shapes/pattern-curve-seven.png' %}" alt="" class="position-absolute end-0 top-0 z-index--1 h-100">
        <div class="account-thumb">
            <img src="{% static 'assets/images/shapes/login.jpg' %}" alt="">
            <div class="statistics animation bg-main text-center">
                <h5 class="statistics__amount text-white">50k</h5>
                <span class="statistics__text text-white font-14">Mijozlar</span>
            </div>
        </div>
    </div>
    <div class="account__right padding-t-120 flx-align">
        <div class="account-content">
            <a href="{% url 'index' %}" class="logo mb-64">
                <img src="{% static 'assets/images/logo/logo.png' %}" alt="">
            </a>
            <h4 class="account-content__title mb-48 text-capitalize">Bepul akkaunt ochish</h4>

            <form method="POST">{% csrf_token %}
                <div class="row gy-4">
                    <div class="col-12">
                        <label for="name" class="form-label mb-2 font-18 font-heading fw-600">Foydalanuvchi nomi</label>
                        <div class="position-relative">
                            <input type="text" class="common-input common-input--bg common-input--withIcon" id="name" name="username" placeholder="Foydalanuvchi nomi">
                            <span class="input-icon"><img src="{% static 'assets/images/icons/user-icon.svg' %}" alt=""></span>
                        </div>
                    </div>
                    <div class="col-12">
                        <label for="email" class="form-label mb-2 font-18 font-heading fw-600">Telefon</label>
                        <div class="position-relative">
                            <input type="text" class="common-input common-input--bg common-input--withIcon" id="email" name="phone" placeholder="+998901234567">
                            <span class="input-icon"><img src="{% static 'assets/images/icons/envelope-icon.svg' %}" alt=""></span>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="your-password" class="form-label mb-2 font-18 font-heading fw-600">Parol</label>
                        <div class="position-relative">
                            <input type="password" class="common-input common-input--bg common-input--withIcon" name="password" id="your-password" placeholder="Kamida 6 ta belgi, 1 ta bosh harf">
                            <span class="input-icon toggle-password cursor-pointer" id="#your-password"><img src="{% static 'assets/images/icons/lock-icon.svg' %}" alt=""></span>
                        </div>
                    </div>

                       <div class="col-12">
                        <label for="your-password2" class="form-label mb-2 font-18 font-heading fw-600">Parolni tasdiqlash</label>
                        <div class="position-relative">
                            <input type="password" class="common-input common-input--bg common-input--withIcon" name="confirm_password" id="your-password2" placeholder="">
                            <span class="input-icon toggle-password cursor-pointer" id="#your-password2"><img src="{% static 'assets/images/icons/lock-icon.svg' %}" alt=""></span>
                        </div>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-main btn-lg w-100 pill"> Ro'yxatdan o'tish</button>
                    </div>
<!--                    <div class="col-12">-->
<!--                        <button type="submit" class="btn btn-outline-light btn-lg-icon btn-lg w-100 pill">-->
<!--                            <span class="icon icon-left"><img src="{% static 'assets/images/icons/google.svg' %}" alt=""></span>-->
<!--                            Sign up with google-->
<!--                        </button>-->
<!--                    </div>-->
                    <div class="col-sm-12 mb-0">
                        <div class="have-account">
                            <p class="text font-14">Akkauntingiz bormi? <a class="link text-main text-decoration-underline  fw-500" href="{% url 'login' %}">Kirish</a></p>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
<!-- ================================== Account Page End =========================== -->

    <!-- Jquery js -->
    <script src="{% static 'assets/js/jquery-3.7.1.min.js' %}"></script>
    <!-- Bootstrap Bundle Js -->
    <script src="{% static 'assets/js/boostrap.bundle.min.js' %}"></script>
    <!-- CountDown -->
    <script src="{% static 'assets/js/countdown.js' %}"></script>
    <!-- counter up -->
    <script src="{% static 'assets/js/counterup.min.js' %}"></script>
    <!-- Slick js -->
    <script src="{% static 'assets/js/slick.min.js' %}"></script>
    <!-- magnific popup -->
    <script src="{% static 'assets/js/jquery.magnific-popup.js' %}"></script>
    <!-- apex chart -->
    <script src="{% static 'assets/js/apexchart.js' %}"></script>

    <!-- main js -->
    <script src="{% static 'assets/js/main.js' %}"></script>

    </body>
</html>
