<!DOCTYPE html>
{% load static %}
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish | DpMarket</title>
    <link rel="shortcut icon" href="{% static 'assets/images/logo/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/fontawesome-all.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/line-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/main.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafbfc;
            padding: 32px 16px;
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border: 1px solid #e8eaed;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 48px rgba(16, 24, 40, 0.06);
        }

        .auth-card__logo {
            display: block;
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-card__logo img {
            max-height: 40px;
        }

        .auth-card__title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #1b2233;
            text-align: center;
            margin-bottom: 6px;
        }

        .auth-card__subtitle {
            font-size: 14px;
            color: #5b6470;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #1b2233;
            margin-bottom: 8px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
            border-color: #e4e6eb;
            font-size: 15px;
            padding: 0 16px;
        }

        .form-control:focus {
            border-color: hsl(var(--main));
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #8a919c;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 10px;
            background: hsl(var(--main));
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.15s ease;
        }

        .btn-submit:hover {
            background: hsl(var(--main2));
            color: #fff;
        }

        .auth-card__footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #5b6470;
        }

        .auth-card__footer a {
            color: hsl(var(--main));
            font-weight: 600;
            text-decoration: none;
        }

        .auth-card__footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="{% url 'index' %}" class="auth-card__logo">
            <img src="{% static 'assets/images/logo/logo.png' %}" alt="DpMarket">
        </a>
        <h1 class="auth-card__title">Ro'yxatdan o'tish</h1>
        <p class="auth-card__subtitle">Bepul akkaunt yarating va xarid qilishni boshlang</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label for="name" class="form-label">Foydalanuvchi nomi</label>
                <input type="text" class="form-control" id="name" name="username" placeholder="Foydalanuvchi nomi" required>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label">Telefon</label>
                <input type="text" class="form-control" id="email" name="phone" placeholder="+998901234567" required>
            </div>

            <div class="mb-4 position-relative">
                <label for="your-password" class="form-label">Parol</label>
                <input type="password" class="form-control" name="password" id="your-password" placeholder="Kamida 6 ta belgi" required>
                <button type="button" class="password-toggle toggle-password" data-target="#your-password"><i class="las la-eye"></i></button>
            </div>

            <div class="mb-4 position-relative">
                <label for="your-password2" class="form-label">Parolni tasdiqlash</label>
                <input type="password" class="form-control" name="confirm_password" id="your-password2" placeholder="Parolni qaytaring" required>
                <button type="button" class="password-toggle toggle-password" data-target="#your-password2"><i class="las la-eye"></i></button>
            </div>

            <button type="submit" class="btn-submit">Ro'yxatdan o'tish</button>
        </form>

        <p class="auth-card__footer">Akkauntingiz bormi? <a href="{% url 'login' %}">Kirish</a></p>
    </div>

    <script src="{% static 'assets/js/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
    <script>
        document.querySelectorAll('.toggle-password').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var input = document.querySelector(btn.dataset.target);
                if (!input) return;
                var type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                btn.querySelector('i').classList.toggle('la-eye');
                btn.querySelector('i').classList.toggle('la-eye-slash');
            });
        });
    </script>

</body>
</html>
