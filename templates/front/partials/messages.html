{% if messages %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        {% for message in messages %}
        setTimeout(() => {
            if (window.showToast) {
                window.showToast("{{ message|escapejs }}");
            }
        }, {{ forloop.counter0 }} * 3500);
        {% endfor %}
    });
</script>
{% endif %}
