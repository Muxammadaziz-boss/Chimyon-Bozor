<!DOCTYPE html>
{% load static %}
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
  <title>Admin Kirish | Chimyon-bozor</title>
  
  <link rel="stylesheet" href="{% static 'assets2/assets/css/app.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets2/assets/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'assets2/assets/css/components.css' %}">
  <link rel="stylesheet" href="{% static 'assets2/assets/css/custom.css' %}">
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/images/logo/favicon-two.png' %}?v=2" />
  <link rel="stylesheet" href="{% static 'assets2/assets/bundles/izitoast/css/iziToast.min.css' %}">
</head>

<body class="bg-light">
  <div class="loader"></div>
  <div id="app">
    <section class="section">
      <div class="container mt-5">
        <div class="row">
          <div class="col-12 col-sm-8 offset-sm-2 col-md-6 offset-md-3 col-lg-6 offset-lg-3 col-xl-4 offset-xl-4">
            <div class="login-brand text-center mb-4">
              <a href="{% url 'index' %}">
                <img src="{% static 'assets2/assets/img/logo.png' %}?v=2" alt="Chimyon-bozor" width="130" class="shadow-light rounded-circle">
              </a>
              <h5 class="mt-2 font-weight-bold text-primary">Chimyon-bozor</h5>
              <small class="text-muted">Boshqaruv Paneli</small>
            </div>

            <div class="card card-primary shadow-sm">
              <div class="card-header">
                <h4 class="font-weight-bold">Tizimga Kirish</h4>
              </div>

              <div class="card-body">
                {% if messages %}
                  {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }} py-2 text-small">
                      {{ message }}
                    </div>
                  {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'd_login' %}" class="needs-validation">
                  {% csrf_token %}
                  <div class="form-group">
                    <label for="username" class="font-weight-bold">Foydalanuvchi nomi (Login)</label>
                    <input id="username" type="text" class="form-control" name="username" tabindex="1" placeholder="admin" required autofocus>
                  </div>

                  <div class="form-group">
                    <label for="password" class="font-weight-bold">Parol</label>
                    <input id="password" type="password" class="form-control" name="password" tabindex="2" placeholder="••••••••" required>
                  </div>

                  <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-lg btn-block" tabindex="3">
                      <i class="fas fa-sign-in-alt mr-1"></i> Kirish
                    </button>
                  </div>
                </form>
              </div>
            </div>

            <div class="simple-footer text-center text-muted mt-3">
              &copy; 2026 Chimyon-bozor. Barcha huquqlar himoyalangan.
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="{% static 'assets2/assets/js/app.min.js' %}"></script>
  <script src="{% static 'assets2/assets/js/scripts.js' %}?v=2.0"></script>
  <script src="{% static 'assets2/assets/bundles/izitoast/js/iziToast.min.js' %}"></script>
</body>

</html>
