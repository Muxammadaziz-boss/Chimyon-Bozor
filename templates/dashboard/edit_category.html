{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Kategoriyani Tahrirlash | Chimyon-bozor{% endblock %}

{% block content %}
<div class="main-content" style="min-height: 740px;">
  <section class="section">
    <div class="section-body">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-header">
              <h4>Kategoriyani Tahrirlash</h4>
            </div>
            <form method="POST" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="card-body">
                <div class="form-group">
                  <label class="font-weight-bold">Kategoriya Nomi <span class="text-danger">*</span></label>
                  <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Joriy Logotip</label>
                  <div class="mb-2">
                    {% if category.logo %}
                      <img src="{{ category.logo.url }}" width="60" height="60" class="rounded shadow-sm" alt="{{ category.name }}">
                    {% else %}
                      <span class="text-muted">Rasm yuklanmagan</span>
                    {% endif %}
                  </div>
                  <label class="font-weight-bold">Yangi Logotip yuklash (ixtiyoriy)</label>
                  <input type="file" name="logo" class="form-control" accept="image/*">
                </div>

                <div class="form-group">
                  <div class="control-label font-weight-bold mb-2">Holati</div>
                  <label class="custom-switch mt-2">
                    <input type="checkbox" name="is_active" class="custom-switch-input" {% if category.is_active %}checked{% endif %}>
                    <span class="custom-switch-indicator"></span>
                    <span class="custom-switch-description">Faol (Saytda ko'rinadi)</span>
                  </label>
                </div>
              </div>

              <div class="card-footer bg-whitesmoke text-right">
                <a href="{% url 'd_list_category' %}" class="btn btn-secondary mr-1">Bekor qilish</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i> O'zgarishlarni saqlash</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
