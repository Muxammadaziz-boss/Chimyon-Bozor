{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Mahsulotni Tahrirlash | Chimyon-bozor{% endblock %}

{% block content %}
<div class="main-content" style="min-height: 740px;">
  <section class="section">
    <div class="section-body">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="card shadow-sm">
            <div class="card-header">
              <h4>Mahsulotni Tahrirlash</h4>
            </div>
            <form method="POST" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="card-body">
                <div class="form-row">
                  <div class="form-group col-md-8">
                    <label class="font-weight-bold">Mahsulot Nomi <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                  </div>
                  <div class="form-group col-md-4">
                    <label class="font-weight-bold">Kategoriya <span class="text-danger">*</span></label>
                    <select name="category" class="form-control selectric" required>
                      {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id == product.category.id %}selected{% endif %}>
                          {{ category.name }}
                        </option>
                      {% endfor %}
                    </select>
                  </div>
                </div>

                <div class="form-row">
                  <div class="form-group col-md-4">
                    <label class="font-weight-bold">Asosiy Narx (so'm) <span class="text-danger">*</span></label>
                    <input type="number" step="any" name="price" class="form-control" value="{{ product.price }}" required>
                  </div>
                  <div class="form-group col-md-4">
                    <label class="font-weight-bold">Chegirma Narxi (so'm)</label>
                    <input type="number" step="any" name="discount_price" class="form-control" value="{{ product.discount_price|default:'' }}">
                  </div>
                  <div class="form-group col-md-4">
                    <label class="font-weight-bold">Ombordagi Soni (dona)</label>
                    <input type="number" name="count" class="form-control" value="{{ product.count }}" min="0" required>
                  </div>
                </div>

                <div class="form-group">
                  <div class="control-label font-weight-bold mb-2">Chegirma Holati</div>
                  <label class="custom-switch mt-2">
                    <input type="checkbox" name="discount_status" class="custom-switch-input" {% if product.discount_status %}checked{% endif %}>
                    <span class="custom-switch-indicator"></span>
                    <span class="custom-switch-description">Chegirmada (Chegirma narxi amal qiladi)</span>
                  </label>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Joriy Rasm</label>
                  <div class="mb-2">
                    {% if product.image %}
                      <img src="{{ product.image.url }}" width="80" height="80" class="rounded shadow-sm object-cover" alt="{{ product.name }}">
                    {% endif %}
                  </div>
                  <label class="font-weight-bold">Yangi Rasm yuklash (ixtiyoriy)</label>
                  <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Mahsulot Tavsifi <span class="text-danger">*</span></label>
                  <textarea name="description" class="form-control" rows="4" required style="height: 120px;">{{ product.description }}</textarea>
                </div>
              </div>

              <div class="card-footer bg-whitesmoke text-right">
                <a href="{% url 'd_list_product' %}" class="btn btn-secondary mr-1">Bekor qilish</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i> O'zgarishlarni saqlash</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
