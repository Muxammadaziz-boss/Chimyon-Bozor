{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Kategoriya Yaratish | Chimyon-bozor{% endblock %}

{% block content %}
<div class="main-content" style="min-height: 740px;">
  <section class="section">
    <div class="section-body">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-header">
              <h4>Yangi Kategoriya Yaratish</h4>
            </div>
            <form method="POST" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="card-body">
                <div class="form-group">
                  <label class="font-weight-bold">Kategoriya Nomi <span class="text-danger">*</span></label>
                  <input type="text" name="name" class="form-control" placeholder="Masalan: Kiyim-kechak, Elektronika..." required>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Logotip / Rasm <span class="text-danger">*</span></label>
                  <input type="file" name="logo" class="form-control" accept="image/*" required>
                  <small class="form-text text-muted">PNG, JPG yoki WEBP formatidagi rasm yuklang.</small>
                </div>

                <div class="form-group">
                  <div class="control-label font-weight-bold mb-2">Holati</div>
                  <label class="custom-switch mt-2">
                    <input type="checkbox" name="is_active" class="custom-switch-input" checked>
                    <span class="custom-switch-indicator"></span>
                    <span class="custom-switch-description">Faol (Saytda ko'rinadi)</span>
                  </label>
                </div>
              </div>

              <div class="card-footer bg-whitesmoke text-right">
                <a href="{% url 'd_list_category' %}" class="btn btn-secondary mr-1">Bekor qilish</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i> Saqlash</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
