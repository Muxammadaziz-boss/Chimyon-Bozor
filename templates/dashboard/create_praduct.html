{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Mahsulot Yaratish | Chimyon-bozor{% endblock %}

{% block content %}
<div class="main-content" style="min-height: 740px;">
  <section class="section">
    <div class="section-body">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="card shadow-sm">
            <div class="card-header">
              <h4>Yangi Mahsulot Qo'shish</h4>
            </div>
            <form method="POST" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="card-body">
                <div class="form-row">
                  <div class="form-group col-md-8">
                    <label class="font-weight-bold">Mahsulot Nomi <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" placeholder="Masalan: Chimyon olma, Erkaklar ko'ylagi..." required>
                  </div>
                  <div class="form-group col-md-4">
                    <label class="font-weight-bold">Kategoriya <span class="text-danger">*</span></label>
                    <select name="category" class="form-control selectric" required>
                      <option value="">Kategoriyani tanlang</option>
                      {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                      {% endfor %}
                    </select>
                  </div>
                </div>

                <div class="form-row">
                  <div class="form-group col-md-4">
                    <label class="font-weight-bold">Asosiy Narx (so'm) <span class="text-danger">*</span></label>
                    <input type="number" step="any" name="price" class="form-control" placeholder="Masalan: 50000" required>
                  </div>
                  <div class="form-group col-md-4">
                    <label class="font-weight-bold">Chegirma Narxi (so'm)</label>
                    <input type="number" step="any" name="discount_price" class="form-control" placeholder="Masalan: 42000">
                  </div>
                  <div class="form-group col-md-4">
                    <label class="font-weight-bold">Ombordagi Soni (dona)</label>
                    <input type="number" name="count" class="form-control" value="10" min="0" required>
                  </div>
                </div>

                <div class="form-group">
                  <div class="control-label font-weight-bold mb-2">Chegirma Holati</div>
                  <label class="custom-switch mt-2">
                    <input type="checkbox" name="discount_status" class="custom-switch-input">
                    <span class="custom-switch-indicator"></span>
                    <span class="custom-switch-description">Chegirmada (Chegirma narxi amal qiladi)</span>
                  </label>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Mahsulot Rasmi <span class="text-danger">*</span></label>
                  <input type="file" name="image" class="form-control" accept="image/*" required>
                  <small class="form-text text-muted">Sifatli va aniq ko'rinadigan rasm yuklang (JPG, PNG, WEBP).</small>
                </div>

                <div class="form-group">
                  <label class="font-weight-bold">Mahsulot Tavsifi <span class="text-danger">*</span></label>
                  <textarea name="description" class="form-control" rows="4" placeholder="Mahsulot haqida batafsil ma'lumot..." required style="height: 120px;"></textarea>
                </div>
              </div>

              <div class="card-footer bg-whitesmoke text-right">
                <a href="{% url 'd_list_product' %}" class="btn btn-secondary mr-1">Bekor qilish</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i> Mahsulotni saqlash</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
